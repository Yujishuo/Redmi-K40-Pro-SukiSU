name: build-haydn-sukisu

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "AGNi 内核分支"
        required: false
        default: "AGNi_haydn_MIUI_ST"
      sukisu_mode:
        description: "SukiSU 驱动模式（main=kprobe 免改源码；builtin=手动 hook + SUSFS）"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - builtin
      sukisu_ref:
        description: "SukiSU 版本（留空=最新；也可填 v4.2.1-r2 / commit）"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 检出构建脚本
        uses: actions/checkout@v4

      # 本地验证过的组合是 clang-18 + lld + LTO，不要退回系统自带的 clang-14，
      # 老版本 clang 在 SukiSU 的部分代码上会报错。
      - name: 安装 clang-18
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget lsb-release software-properties-common gnupg
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18
          clang-18 --version | head -1

      - name: 安装编译依赖
        run: |
          set -e
          sudo apt-get install -y -qq \
            bc bison build-essential flex libssl-dev libelf-dev \
            python3 git zip unzip curl ca-certificates lz4 zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 拉取内核源码
        run: |
          set -e
          git clone --depth=1 --single-branch \
            --branch "${{ inputs.kernel_branch }}" \
            https://github.com/psndna88/AGNi_pureMIUI.git kernel
          cd kernel
          echo "内核源码版本："
          head -5 Makefile

      - name: 集成 SukiSU 驱动
        run: |
          set -e
          cd kernel
          # AGNi 树自带 KernelSU-Next 驱动目录，先摘掉，
          # 否则官方 setup.sh 看到目录已存在会直接跳过集成
          rm -rf drivers/kernelsu KernelSU
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "${{ inputs.sukisu_mode }}"
          if [ -n "${{ inputs.sukisu_ref }}" ]; then
            cd KernelSU
            git fetch --tags --depth=1 origin "${{ inputs.sukisu_ref }}" || true
            git checkout "${{ inputs.sukisu_ref }}"
            cd ..
          fi
          echo "SukiSU 提交：$(cd KernelSU && git rev-parse --short HEAD)"
          ls -l drivers/kernelsu

      # 关键步骤：不跑这段，5.4 上根本编译不过。
      # 覆盖 8 处零散兼容（pgtable.h / file_wrapper / p4d / seccomp_cache /
      # pkg_observer / TWA_RESUME / cpu_spoof / dispatch.c）+ SELinux 子系统 + defconfig
      - name: 应用 Linux 5.4 兼容补丁
        run: |
          set -e
          bash scripts/patch-all-5.4.sh ./kernel
          echo "--- 校验关键 config ---"
          grep -E '^CONFIG_(KSU|KPROBES|EXT4_FS)=' \
            kernel/arch/arm64/configs/agni_haydn_defconfig || true

      - name: 编译内核
        run: |
          set -e
          cd kernel
          export PATH=/usr/lib/llvm-18/bin:$PATH
          MAKE_ARGS="ARCH=arm64 O=out
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
          make $MAKE_ARGS agni_haydn_defconfig
          make $MAKE_ARGS -j"$(nproc --all)"
          ls -lh out/arch/arm64/boot/Image

      - name: 校验产物
        run: |
          set -e
          cd kernel
          file out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version" || true
          strings out/arch/arm64/boot/Image | grep -m1 -i "kernelsu" || true
          cp out/arch/arm64/boot/Image ../Image
          cp out/.config ../kernel.config

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ inputs.sukisu_mode }}
          path: |
            Image
            kernel.config
          if-no-files-found: error
